<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bruno | Pawsitive Change</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f8f1e7;
            color: #4b2e1f;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        .back {
            display: inline-block;
            margin-bottom: 25px;
            text-decoration: none;
            color: #6b4028;
            font-weight: bold;
        }

        .back:hover {
            text-decoration: underline;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        h1 {
            margin-top: 0;
            font-size: 36px;
        }

        .status {
            display: inline-block;
            background: #d9ead3;
            color: #38761d;
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .location {
            font-size: 17px;
            margin-bottom: 25px;
        }

        .pet-photo {
            width: 100%;
            max-width: 600px;
            display: block;
            margin: 0 auto;
            border-radius: 18px;
            object-fit: cover;
        }

        .journey-text {
            margin-top: 25px;
            line-height: 1.7;
            font-size: 17px;
        }
    </style>
</head>

<body>

    <div class="container">

        <a href="../../animals.html" class="back">
            ← Back to Animal Journey
        </a>

        <div class="card">

            <h1>Bruno</h1>

            <div class="status">
                Adopted
            </div>

            <div class="location">
                📍 <strong>Location Found:</strong> Anilao-Labac, Lipa City
            </div>

            <img
                src="Bruno_p1.jpg"
                alt="Bruno"
                class="pet-photo"
            >

            <div class="journey-text">
                <h2>Bruno's Journey</h2>

                <p>
                    Bruno was found in Anilao-Labac, Lipa City.
                    Through the efforts of Pawsitive Change, Bruno
                    found a new home and was successfully adopted.
                </p>
            </div>

        </div>

    </div>

</body>
</html>
