<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Poobert | Pawsitive Change</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f8f1e7;
            color: #4b2e1f;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        .back {
            display: inline-block;
            margin-bottom: 25px;
            text-decoration: none;
            color: #6b4028;
            font-weight: bold;
        }

        .back:hover {
            text-decoration: underline;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        h1 {
            margin-top: 0;
            font-size: 36px;
        }

        h2 {
            margin-top: 35px;
        }

        .status {
            display: inline-block;
            background: #d9ead3;
            color: #38761d;
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .location {
            font-size: 17px;
            margin-bottom: 30px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-top: 20px;
        }

        .gallery img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: 18px;
        }

        .video-container {
            margin-top: 35px;
        }

        .video-container video {
            width: 100%;
            max-width: 700px;
            display: block;
            margin: 0 auto 25px;
            border-radius: 18px;
        }

        .journey-text {
            margin-top: 35px;
            line-height: 1.7;
            font-size: 17px;
        }

        @media (max-width: 600px) {
            .gallery {
                grid-template-columns: 1fr;
            }

            .gallery img {
                height: auto;
            }

            h1 {
                font-size: 30px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <a href="../../animals.html" class="back">
            ← Back to Animal Journey
        </a>

        <div class="card">

            <h1>Poobert</h1>

            <div class="status">
                Adopted
            </div>

            <div class="location">
                📍 <strong>Location:</strong> Rosario
            </div>


            <!-- PHOTO GALLERY -->
            <h2>Poobert's Photos</h2>

            <div class="gallery">

                <img src="Poobert_p1.jpg" alt="Poobert photo 1">

                <img src="Poobert_p2.jpg" alt="Poobert photo 2">

                <img src="Poobert_p3.jpg" alt="Poobert photo 3">

                <img src="Poobert_p4.jpg" alt="Poobert photo 4">

                <img src="Poobert_p5.jpg" alt="Poobert photo 5">

                <img src="Poobert_p6.jpg" alt="Poobert photo 6">

            </div>


            <!-- VIDEOS -->
            <div class="video-container">

                <h2>Poobert's Journey Videos</h2>

                <video controls>
                    <source src="Poobert_v1.mp4" type="video/mp4">
                    Your browser does not support the video.
                </video>

                <video controls>
                    <source src="Poobert_v2.mp4" type="video/mp4">
                    Your browser does not support the video.
                </video>

            </div>


            <!-- JOURNEY DESCRIPTION -->
            <div class="journey-text">

                <h2>Poobert's Journey</h2>

                <p>
                    Poobert was found in Rosario and was
                    successfully adopted through Pawsitive Change.
                </p>

            </div>

        </div>

    </div>

</body>
</html>
