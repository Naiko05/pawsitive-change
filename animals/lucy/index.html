<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lucy | Pawsitive Change</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f8f1e7;
            color: #4b2e1f;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        .back {
            display: inline-block;
            margin-bottom: 25px;
            text-decoration: none;
            color: #6b4028;
            font-weight: bold;
        }

        .back:hover {
            text-decoration: underline;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
            font-size: 36px;
        }

        h2 {
            margin-top: 0;
            color: #4b2e1f;
        }

        .status {
            display: inline-block;
            background: #fce5cd;
            color: #783f04;
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .location {
            font-size: 17px;
            margin-bottom: 25px;
        }

        .pet-photo {
            width: 100%;
            max-width: 600px;
            display: block;
            margin: 0 auto 30px;
            border-radius: 18px;
        }

        .video-container {
            margin-top: 30px;
        }

        video {
            width: 100%;
            max-width: 700px;
            display: block;
            margin: 0 auto;
            border-radius: 18px;
            background: #000;
        }

        .video-link {
            display: block;
            width: fit-content;
            margin: 15px auto 0;
            padding: 10px 18px;
            background: #6b4028;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
        }

        .video-link:hover {
            background: #4b2e1f;
        }

        .journey-text {
            margin-top: 30px;
            line-height: 1.7;
            font-size: 17px;
        }
    </style>
</head>

<body>

    <div class="container">

        <a href="../../animals.html" class="back">
            ← Back to Animal Journey
        </a>

        <div class="card">

            <h1>Lucy</h1>

            <div class="status">
                Stray
            </div>

            <div class="location">
                📍 <strong>Location:</strong> Lipa City, Cathedral
            </div>

            <!-- Lucy's Picture -->
            <img
                src="Lucy_p1.jpg"
                alt="Lucy"
                class="pet-photo"
            >

            <!-- Lucy's Video -->
            <div class="video-container">

                <h2>Lucy's Journey</h2>

                <video controls preload="metadata">
                    <source src="Lucy_v1.mp4" type="video/mp4">

                    Your browser does not support this video.
                </video>

                <a
                    href="Lucy_v1.mp4"
                    class="video-link"
                    target="_blank"
                >
                    ▶ Open Video
                </a>

            </div>

            <div class="journey-text">

                <p>
                    Lucy was found in Lipa City, Cathedral.
                    She is currently listed as a stray as she continues
                    her journey through Pawsitive Change.
                </p>

            </div>

        </div>

    </div>

</body>
</html>
```
